name: Sync Workflow to Child Repos

on:
  push:
    branches: [main]

jobs:
  sync:
    name: Sync to ${{ matrix.repo }}
    runs-on: ubuntu-latest
    concurrency:
      group: sync-workflow-to-child-repos-${{ matrix.repo }}
      cancel-in-progress: true
    strategy:
      matrix:
        repo: [ai-arena, dungeon-game-ai-arena, reversi-adventure, reversi-ai-arena, vim-learning-game, ww, envdiff]
      fail-fast: false

    steps:
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Rewrite SSH submodule URLs to HTTPS (reversi-adventure uses SSH)
          git config --global url."https://x-access-token:${{ secrets.WORKFLOW_SYNC_GITHUB_TOKEN }}@github.com/".insteadOf "git@github.com:"

      - name: Clone child repo
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_SYNC_GITHUB_TOKEN }}
        run: |
          git clone \
            https://x-access-token:${GH_TOKEN}@github.com/yoskeoka/${{ matrix.repo }}.git \
            child-repo

      - name: Check if child workflow asset update is needed
        id: check
        run: |
          cd child-repo
          git submodule update --init .claude/vendor/workflow
          git -C .claude/vendor/workflow fetch origin main
          CURRENT_SHA=$(git -C .claude/vendor/workflow rev-parse HEAD)
          NEW_SHA="${{ github.sha }}"
          echo "current_sha=${CURRENT_SHA}" >> $GITHUB_OUTPUT
          if [ "$CURRENT_SHA" = "$NEW_SHA" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Submodule already at $NEW_SHA, skipping."
          elif git -C .claude/vendor/workflow diff --quiet "$CURRENT_SHA" "$NEW_SHA" -- \
            skills/ \
            setup-workspace.sh \
            tools/install-hooks.sh \
            .githooks/pre-push \
            tools/workflow-lint.sh \
            .github/workflows/workflow-lint.yml; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "No child-consumed workflow changes between $CURRENT_SHA and $NEW_SHA, skipping."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Will update child-consumed workflow assets: $CURRENT_SHA → $NEW_SHA"
          fi

      - name: Close stale sync PRs
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_SYNC_GITHUB_TOKEN }}
          NEW_SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${NEW_SHA:0:7}"

          # Collect all open workflow-sync PRs (numbers and their branch names)
          gh pr list \
            --repo yoskeoka/${{ matrix.repo }} \
            --state open \
            --label workflow-sync \
            --json number,headRefName \
            --jq '.[] | "\(.number) \(.headRefName)"' \
          | while read -r PR_NUM PR_BRANCH; do
              echo "Closing stale sync PR #${PR_NUM} (${PR_BRANCH}) — superseded by ${SHORT_SHA}"
              gh pr close "${PR_NUM}" \
                --repo yoskeoka/${{ matrix.repo }} \
                --comment ":recycle: Closing this PR because it has been superseded by a newer workflow sync to [\`${SHORT_SHA}\`](https://github.com/yoskeoka/vibe-coding-workspace/commit/${NEW_SHA}). Please merge the latest PR instead." \
                --delete-branch
            done

      - name: Ensure workflow-sync label exists
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_SYNC_GITHUB_TOKEN }}
        run: |
          gh label create workflow-sync \
            --repo yoskeoka/${{ matrix.repo }} \
            --color 0E8A16 \
            --description "Automated workflow sync PRs" \
            --force

      - name: Create sync PR for workflow asset update
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_SYNC_GITHUB_TOKEN }}
          CURRENT_SHA: ${{ steps.check.outputs.current_sha }}
          NEW_SHA: ${{ github.sha }}
        run: |
          cd child-repo
          SHORT_SHA="${NEW_SHA:0:7}"
          BRANCH="workflow-sync/${SHORT_SHA}"

          git checkout -b "${BRANCH}"

          # Point submodule to the exact commit that triggered this workflow
          git -C .claude/vendor/workflow fetch origin
          git -C .claude/vendor/workflow checkout "${NEW_SHA}"
          ./.claude/vendor/workflow/tools/install-hooks.sh .

          git add -A
          COMMIT_SUBJECT=$(git -C .claude/vendor/workflow log -1 --format=%s "${NEW_SHA}")
          COMMIT_LIST=$(git -C .claude/vendor/workflow log --format='- %h %s' "${CURRENT_SHA}..${NEW_SHA}" -- \
            skills/ \
            setup-workspace.sh \
            tools/install-hooks.sh \
            .githooks/pre-push \
            tools/workflow-lint.sh \
            .github/workflows/workflow-lint.yml)
          DIFF_STAT=$(git diff --stat --cached)
          COMMIT_MSG=$(cat << EOF
          chore: sync workflow assets to ${SHORT_SHA}

          Automated sync from yoskeoka/vibe-coding-workspace@${NEW_SHA}

          Co-authored-by: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          EOF
          )
          git commit -m "${COMMIT_MSG}"

          REMOTE_REF="refs/heads/${BRANCH}"
          REMOTE_SHA=$(git ls-remote --heads origin "${BRANCH}" | awk '{print $1}')
          if [ -n "${REMOTE_SHA}" ]; then
            echo "Updating existing remote branch ${BRANCH} with force-with-lease (${REMOTE_SHA})"
            git push --force-with-lease="${REMOTE_REF}:${REMOTE_SHA}" origin "${BRANCH}"
          else
            git push origin "${BRANCH}"
          fi

          PR_BODY=$(cat << EOF
          ## Automated Workflow Sync

          Updates the workflow submodule and copied workflow runtime assets for child-consumed workflow changes.

          | | |
          |---|---|
          | **Source repo** | [yoskeoka/vibe-coding-workspace](https://github.com/yoskeoka/vibe-coding-workspace) |
          | **Commit** | [\`${SHORT_SHA}\`](https://github.com/yoskeoka/vibe-coding-workspace/commit/${NEW_SHA}) |
          | **Commit subject** | \`${COMMIT_SUBJECT}\` |
          | **Previous** | \`${{ steps.check.outputs.current_sha }}\` |

          ### Relevant commits

          ${COMMIT_LIST}

          ### Diff stat

          \`\`\`
          ${DIFF_STAT}
          \`\`\`

          > [!NOTE]
          > Any older \`workflow-sync\` PRs in this repository have been automatically closed. This is the only PR to merge.

          This PR was created automatically by the \`sync-workflow-to-child-repos\` GitHub Actions workflow.
          EOF
          )

          gh pr create \
            --repo yoskeoka/${{ matrix.repo }} \
            --title "chore: sync workflow assets to ${SHORT_SHA}" \
            --body "${PR_BODY}" \
            --base main \
            --head "${BRANCH}" \
            --label workflow-sync

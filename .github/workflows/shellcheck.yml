name: ShellCheck

"on":
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    env:
      SHELLCHECK_VERSION: 0.11.0
      SHELLCHECK_ARCHIVE: shellcheck-v0.11.0.linux.x86_64.tar.xz
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install ShellCheck
        run: |
          set -euo pipefail
          archive_url="https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${SHELLCHECK_ARCHIVE}"

          curl -fsSL "$archive_url" -o shellcheck.tar.xz
          printf '%s  %s\n' "$SHELLCHECK_SHA256" shellcheck.tar.xz | sha256sum --check --status
          tar -xf shellcheck.tar.xz
          sudo install "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: Fetch PR base branch
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin \
            "+refs/heads/${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}"

      - name: Run ShellCheck for changed Bash scripts
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          set -euo pipefail

          has_shellcheck_directive() {
            local path="$1"
            grep -Eq '^[[:space:]]*# shellcheck shell=' "$path"
          }

          has_shebang() {
            local path="$1"
            local first_line

            if ! IFS= read -r first_line < "$path"; then
              return 1
            fi

            case "$first_line" in
              '#!'*)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          mapfile -t files < <(./tools/list-changed-bash-scripts.sh "$BASE_REF")

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed Bash scripts found."
            exit 0
          fi

          printf 'Changed Bash scripts:\n'
          printf '  %s\n' "${files[@]}"

          for path in "${files[@]}"; do
            case "$path" in
              *.sh|*.bash)
                if has_shellcheck_directive "$path" || has_shebang "$path"; then
                  shellcheck "$path"
                else
                  shellcheck --shell=bash "$path"
                fi
                ;;
              *)
                shellcheck "$path"
                ;;
            esac
          done
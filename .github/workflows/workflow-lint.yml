name: Workflow Lint

on:
  pull_request:
    branches: [main]

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run workflow linter
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          ./tools/workflow-lint.sh --mode=ci --pr-title="$PR_TITLE" --pr-body="$PR_BODY"

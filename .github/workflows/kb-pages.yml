name: kb-pages

on:
  pull_request:
    paths:
      - 'docs/kb/**'
      - 'mkdocs.kb.template.yml'
      - 'tools/kb'
      - 'tools/kb_generate.py'
      - 'requirements-kb.txt'
      - '.github/workflows/kb-pages.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/kb/**'
      - 'mkdocs.kb.template.yml'
      - 'tools/kb'
      - 'tools/kb_generate.py'
      - 'requirements-kb.txt'
      - '.github/workflows/kb-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kb-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Configure Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Build site
        run: tools/kb build
      - name: Upload artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .site/kb

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

site_name: vibe-coding-workspace KB
site_description: Workspace knowledge base for AI-centered personal development
site_url: https://yoskeoka.github.io/vibe-coding-workspace/
repo_url: https://github.com/yoskeoka/vibe-coding-workspace
docs_dir: __GENERATED_DOCS_DIR__
site_dir: __GENERATED_SITE_DIR__
use_directory_urls: true

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true

extra_javascript:
  - assets/javascripts/kb-nav-default-state.js

nav:
  - Index: index.md
  - Log: wiki/log.md
  - Topics:
      - LLM Knowledge Bases: wiki/topics/llm-knowledge-bases.md
      - AI-Assisted Game Development: wiki/topics/ai-game-dev.md
      - Deployment Options: wiki/topics/deployment-options.md
      - Pixel Art UI: wiki/topics/pixel-art-ui.md
  - Tools:
      - Phaser: wiki/tools/phaser.md
  - Patterns:
      - Source Ingestion: wiki/patterns/source-ingestion.md
      - Cheap Hosting: wiki/patterns/cheap-hosting.md
  - Projects:
      - ww: wiki/projects/ww.md
      - reversi-adventure: wiki/projects/reversi-adventure.md
      - vim-learning-game: wiki/projects/vim-learning-game.md
  - Sources:
__GENERATED_SOURCES_NAV__
  - KB Docs:
      - Home: kb-docs/README.md
      - Schema: schema.md
      - Ingest: ingest.md

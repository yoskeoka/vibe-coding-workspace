site_name: vibe-coding-workspace KB
site_description: Workspace knowledge base for AI-centered personal development
site_url: https://yoskeoka.github.io/vibe-coding-workspace/
repo_url: https://github.com/yoskeoka/vibe-coding-workspace
docs_dir: __GENERATED_DOCS_DIR__
site_dir: __GENERATED_SITE_DIR__
use_directory_urls: true

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          build: true
          default: true
          link: /
          site_name: vibe-coding-workspace KB
          site_description: Workspace knowledge base for AI-centered personal development
        - locale: ja
          name: 日本語
          build: true
          link: /ja/
          site_name: vibe-coding-workspace ナレッジベース
          site_description: AI中心の個人開発向けワークスペースナレッジベース
          theme:
            language: ja
          nav:
__GENERATED_JA_NAV__

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true

extra_javascript:
  - assets/javascripts/kb-nav-default-state.js

nav:
__GENERATED_EN_NAV__
